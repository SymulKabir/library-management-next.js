apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-management
  labels:
    app: library-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-management
  template:
    metadata:
      labels:
        app: library-management
    spec:
      containers:
        - name: library-management
          image: saimonpranta/library-management:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: JWT_SECRET
              value: "8hjA9ks@Hls9Sjc"

            - name: DB_HOST
              value: "mysql"

            - name: DB_PORT
              value: "3306"

            - name: DB_USER
              value: "book_hive"

            - name: DB_PASSWORD
              value: "12345"

            - name: DB_NAME
              value: "library_management"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: library-management
  labels:
    app: library-management
spec:
  type: ClusterIP
  selector:
    app: library-management
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000